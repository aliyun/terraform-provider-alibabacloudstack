name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ./...

    - name: Build darwin/arm64 provider binary
      run: |
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o terraform-provider-alibabacloudstack_v3.18.33 .

    - name: Upload provider artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-provider-alibabacloudstack-darwin-arm64
        path: terraform-provider-alibabacloudstack_v3.18.33
